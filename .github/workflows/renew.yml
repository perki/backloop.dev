# Certificate renewal — currently NOT operational, and deliberately not scheduled.
#
# Since 2026-08-01 Let's Encrypt refuses to issue for this domain:
#   Cannot issue for "*.backloop.dev": The ACME server refuses to issue a
#   certificate for this domain name, because it is forbidden by policy
#
# The published wildcard is now bought from a commercial CA and the site is
# hosted on Apache at Gandi, so publication is a manual step: build into
# `dist/` and copy that directory onto the server. Nothing is committed.
#
# This workflow is kept for the ACME plumbing (account, Gandi DNS-01 challenge)
# in case issuance becomes possible again. It runs only when started by hand,
# and it publishes nothing — it uploads `dist/` as an artifact for inspection.

name: Renew SSL certificate (manual, Let's Encrypt currently blocks this domain)

on:
  workflow_dispatch:

env:
  GANDI_API_TOKEN: ${{ secrets.GANDI_API_TOKEN }}
  ACME_ACCOUNT_URL: ${{ secrets.ACME_ACCOUNT_URL }}
  ACME_ACCOUNT_KEY: ${{ secrets.ACME_ACCOUNT_KEY }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Fetch dependencies
      working-directory: ./renew
      run: npm ci

    - name: Generate new certificate into dist/
      working-directory: ./renew
      # uses env: GANDI_API_TOKEN, ACME_ACCOUNT_URL, ACME_ACCOUNT_KEY
      run: IS_PRODUCTION=true npm start

    - name: Upload dist/ for manual publication
      uses: actions/upload-artifact@v4
      with:
        name: backloop.dev-dist
        path: dist/
        retention-days: 7
